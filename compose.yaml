services:
  api:
    build:
      context: .
      target: api
    platform: linux/arm64
    environment:
      AGENT_MODE: ${AGENT_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-false}
      AUTOMATIONS_ENABLED: ${AUTOMATIONS_ENABLED:-false}
      AUTOMATION_POLL_MS: ${AUTOMATION_POLL_MS:-5000}
      SPEECH_MODE: ${SPEECH_MODE:-mock}
      SPEECH_TRANSCRIPTION_MODEL: ${SPEECH_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe-2025-12-15}
      SPEECH_TTS_MODEL: ${SPEECH_TTS_MODEL:-gpt-4o-mini-tts-2025-12-15}
      SPEECH_VOICE: ${SPEECH_VOICE:-coral}
      SPEECH_LANGUAGE: ${SPEECH_LANGUAGE:-en}
      SPEECH_TIMEOUT_MS: ${SPEECH_TIMEOUT_MS:-30000}
      SATELLITE_TOKEN: ${SATELLITE_TOKEN:-}
      DEVICE_BACKEND: ${DEVICE_BACKEND:-mock}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_LIGHT_IDS: ${HA_LIGHT_IDS:-}
      HA_WRITE_LIGHT_IDS: ${HA_WRITE_LIGHT_IDS:-}
      HA_TIMEOUT_MS: ${HA_TIMEOUT_MS:-5000}
      HA_CONFIRMATION_TIMEOUT_MS: ${HA_CONFIRMATION_TIMEOUT_MS:-3000}
      WEB_ORIGIN: http://localhost:8080
    volumes:
      - aura-data:/app/data
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      target: web
    platform: linux/arm64
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  aura-data:
